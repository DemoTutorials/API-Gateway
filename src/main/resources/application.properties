server.port=7000
spring.application.name=API-Gateway

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:7073/eureka/
eureka.instance.prefer-ip-address=true

# Gateway routes
spring.cloud.gateway.server.webflux.routes[0].id=USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/UserService/**

spring.cloud.gateway.server.webflux.routes[1].id=HOTEL-SERVICE
spring.cloud.gateway.server.webflux.routes[1].uri=lb://HOTEL-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/HotelService/**

# Actuator settings
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=unrestricted
